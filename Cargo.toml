[package]
name = "astrum"
version = "0.2.0"
edition = "2024"
description = "A persistent terminal with tabs, mouse support and a built-in AI agent"
license = "Apache-2.0"
repository = "https://github.com/robert-mcdermott/astrum"
readme = "README.md"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
aws-lc-rs = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
futures-util = "0.3.34"
libc = "0.2.191"
portable-pty = "0.9"
ratatui = "0.30"
regex-automata = "0.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
toml = "1.2.1"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
