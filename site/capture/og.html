<!doctype html>
<meta charset="utf-8">
<!-- The picture shown when a link to the site is shared: 1200 × 630. -->
<style>
  html, body { margin: 0; background: #0b0c16; }
  #card {
    position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; padding: 64px 70px;
    background: radial-gradient(700px 380px at 10% 0%, rgba(93, 228, 255, 0.16), transparent 70%), radial-gradient(800px 420px at 95% 10%, rgba(157, 124, 255, 0.24), transparent 70%), #0b0c16;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e8eafb;
  }
  .wordmark { height: 64px; display: block; }
  h1 { font-size: 46px; line-height: 1.15; letter-spacing: -0.03em; margin: 40px 0 18px; max-width: 560px; font-weight: 750; }
  h1 span { background: linear-gradient(135deg, #5de4ff, #7aa8ff 50%, #9d7cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { font-size: 22px; line-height: 1.45; color: #b8bcdc; max-width: 520px; margin: 0; }
  .shot { position: absolute; left: 640px; top: 120px; width: 760px; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); border: 1px solid rgba(220, 223, 245, 0.16); }
  .shot img { display: block; width: 100%; }
  .url { position: absolute; left: 70px; bottom: 56px; font-size: 18px; color: #9297bd; }
</style>
<div id="card">
  <img class="wordmark" src="{{logo}}/astrum-wordmark-on-dark.svg" alt="Astrum">
  <h1>Your own shell, with <span>tabs that stay</span> and an agent beside you</h1>
  <p>A persistent terminal with tabs, mouse support and a built-in AI agent.</p>
  <div class="shot"><img src="{{images}}/hero-dark.webp" alt=""></div>
  <div class="url">robert-mcdermott.github.io/astrum</div>
</div>
